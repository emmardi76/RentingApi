services:
  postgres:
    image: postgres:16-alpine
    container_name: renting-postgres
    environment:
      POSTGRES_USER: renting_user
      POSTGRES_PASSWORD: renting_pass
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renting_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  default:
    external:
      name: my-preference_network
