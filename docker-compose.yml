version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: renting_user
      POSTGRES_PASSWORD: renting_pass
      POSTGRES_DB: renting_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renting_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: